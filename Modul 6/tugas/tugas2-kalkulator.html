<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Sederhana</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    input[type=text] { font-size: 16px; padding: 6px; width: 160px; }
    button { font-size: 18px; width: 48px; height: 40px; margin-right: 4px; }
    p { margin: 12px 0; }
  </style>
  <script>
    function hitung(operator) {
      var bil1 = parseFloat(document.getElementById("bil1").value);
      var bil2 = parseFloat(document.getElementById("bil2").value);
      var hasil;

      if (isNaN(bil1) || isNaN(bil2)) {
        document.getElementById("hasil").value = "Isi kedua bilangan";
        return;
      }

      if (operator == "+") hasil = bil1 + bil2;
      else if (operator == "-") hasil = bil1 - bil2;
      else if (operator == "x") hasil = bil1 * bil2;
      else if (operator == "/") {
        if (bil2 == 0) { document.getElementById("hasil").value = "Tidak bisa dibagi 0"; return; }
        hasil = bil1 / bil2;
      }

      document.getElementById("hasil").value = hasil;
    }
  </script>
</head>
<body>
  <h2>Kalkulator Sederhana</h2>
  <form>
    <p>Bil 1 : <input type="text" id="bil1"></p>
    <p>Bil 2 : <input type="text" id="bil2"></p>
    <p>
      <button type="button" onclick="hitung('+')">+</button>
      <button type="button" onclick="hitung('-')">-</button>
      <button type="button" onclick="hitung('x')">x</button>
      <button type="button" onclick="hitung('/')">/</button>
    </p>
    <p>Hasil : <input type="text" id="hasil" readonly></p>
  </form>
</body>
</html>
